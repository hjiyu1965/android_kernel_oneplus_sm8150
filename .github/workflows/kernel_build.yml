name: Build Kernel
on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main  # 改回 main 分支
        with:
          kernel-url: https://github.com/hjiyu1965/android_kernel_oneplus_sm8150
          kernel-dir: msm-4.9
          kernel-branch: lineage-23.0
          config: vendor/sm8150-perf_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 11
          aosp-clang-version: r383902
          disable-lto: true
          anykernel3: true

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus-SM8150-Kernel
          path: output/*.zip   # 根据 Action 的实际输出路径调整
