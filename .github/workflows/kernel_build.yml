name: Build OnePlus SM8150 Kernel 4.14 (Fast Runner)

on:
  push:
    branches: [ lineage-23.0 ]
  workflow_dispatch:

jobs:
  build:
    # 换成ubuntu-latest，Runner资源最多，调度最快
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 一键安装依赖+适配4.14的交叉编译工具链
        run: |
          set -euo pipefail
          sudo apt update -y
          # Ubuntu 22.04官方源自带的交叉编译GCC，完美向下兼容4.14内核，无需额外下载
          sudo apt install -y \
            git make bc bison flex libssl-dev libncurses-dev \
            build-essential zip lz4 zstd libelf-dev device-tree-compiler \
            python3 python3-pip gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: 内核编译（纯GCC，零兼容问题）
        run: |
          set -euo pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=aarch64-linux-gnu-gcc
          export LD=aarch64-linux-gnu-ld
          export AR=aarch64-linux-gnu-ar
          export NM=aarch64-linux-gnu-nm
          export OBJCOPY=aarch64-linux-gnu-objcopy
          export OBJDUMP=aarch64-linux-gnu-objdump
          export STRIP=aarch64-linux-gnu-strip

          make O=out vendor/sm8150-perf_defconfig
          make O=out -j$(nproc)

      - name: 打包AnyKernel3刷入包
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          # 兼容一加SM8150的两种常见内核镜像格式
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ || \
          cp out/arch/arm64/boot/Image AnyKernel3/
          cp -r out/arch/arm64/boot/dts/qcom/* AnyKernel3/dtb/ 2>/dev/null || true
          
          cd AnyKernel3
          zip -r9 OnePlus-SM8150-Kernel.zip * -x .git README.md
          cd ..

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus-SM8150-Kernel-4.14
          path: AnyKernel3/OnePlus-SM8150-Kernel.zip
          retention-days: 30
