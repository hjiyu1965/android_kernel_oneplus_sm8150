name: Build OnePlus SM8150 Kernel 4.14

on:
  push:
    branches: [ lineage-23.0 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git make bc bison flex libssl-dev libncurses-dev \
            build-essential zip curl lz4 zstd libelf-dev

      - name: Download Clang 11 (for 4.14)
        run: |
          mkdir -p clang
          curl -L https://github.com/llvm/llvm-project/releases/download/llvmorg-11.0.1/clang+llvm-11.0.1-x86_64-linux-gnu-ubuntu-20.04.tar.xz | \
          tar xJf - --strip-components=1 -C clang

      - name: Download GCC aarch64
        run: |
          mkdir -p gcc
          curl -L https://releases.linaro.org/components/toolchain/binaries/7.5-2019.10/aarch64-linux-gnu/gcc-linaro-7.5.0-2019.10-x86_64_aarch64-linux-gnu.tar.xz | \
          tar xJf - --strip-components=1 -C gcc

      - name: Build
        run: |
          export PATH=$PWD/clang/bin:$PWD/gcc/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LD=ld.lld
          
          make O=out vendor/sm8150-perf_defconfig
          make O=out -j$(nproc)

      - name: Pack AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 kernel.zip * -x .git README.md

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus_SM8150_Kernel
          path: AnyKernel3/kernel.zip
