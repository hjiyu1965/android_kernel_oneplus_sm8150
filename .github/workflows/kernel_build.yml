name: Build OnePlus SM8150 Kernel (4.14)
on:
  push:
    branches: [ "lineage-23.0" ]
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_USER: builder
      KBUILD_BUILD_HOST: github-action
      DEFCONFIG_NAME: sm8150-perf_defconfig
      CLANG_VERSION: clang-r416183b
      ANDROID_TAG: android-13.0.0_r1

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: lineage-23.0
          submodules: recursive
          fetch-depth: 0

      - name: Setup ccache Cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-sm8150-kernel-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sm8150-kernel-ccache-

      - name: Install Build Dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libncurses5-dev \
            zip unzip curl wget git python2 python3 libelf-dev kmod cpio ccache
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          ccache -M 10G
          ccache -o compression=true
          ccache -s

      - name: Download & Setup Toolchain
        run: |
          set -euo pipefail
          TOOLCHAIN_DIR="${{ github.workspace }}/toolchain"
          mkdir -p "${TOOLCHAIN_DIR}/clang" "${TOOLCHAIN_DIR}/aarch64-linux-android-4.9" "${TOOLCHAIN_DIR}/arm-linux-androideabi-4.9"

          wget -q -O clang.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/${ANDROID_TAG}/${CLANG_VERSION}.tar.gz"
          tar -xzf clang.tar.gz -C "${TOOLCHAIN_DIR}/clang"
          rm -f clang.tar.gz

          wget -q -O aarch64-gcc.tar.gz "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/${ANDROID_TAG}.tar.gz"
          tar -xzf aarch64-gcc.tar.gz -C "${TOOLCHAIN_DIR}/aarch64-linux-android-4.9"
          rm -f aarch64-gcc.tar.gz

          wget -q -O arm32-gcc.tar.gz "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/${ANDROID_TAG}.tar.gz"
          tar -xzf arm32-gcc.tar.gz -C "${TOOLCHAIN_DIR}/arm-linux-androideabi-4.9"
          rm -f arm32-gcc.tar.gz

          echo "${TOOLCHAIN_DIR}/clang/bin" >> $GITHUB_PATH
          echo "${TOOLCHAIN_DIR}/aarch64-linux-android-4.9/bin" >> $GITHUB_PATH
          echo "${TOOLCHAIN_DIR}/arm-linux-androideabi-4.9/bin" >> $GITHUB_PATH

      - name: Verify Toolchain
        run: |
          set -euo pipefail
          echo "=== Toolchain Check ==="
          python --version
          clang --version
          aarch64-linux-android-gcc --version
          which clang aarch64-linux-android-gcc arm-linux-androideabi-gcc

      - name: Load Kernel Defconfig
        run: |
          set -euo pipefail
          export CC="ccache clang"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          DEFCONFIG_PATH=""
          if [ -f "arch/${ARCH}/configs/vendor/${DEFCONFIG_NAME}" ]; then
            DEFCONFIG_PATH="vendor/${DEFCONFIG_NAME}"
          elif [ -f "configs/vendor/${DEFCONFIG_NAME}" ]; then
            cp -f "configs/vendor/${DEFCONFIG_NAME}" "arch/${ARCH}/configs/"
            DEFCONFIG_PATH="${DEFCONFIG_NAME}"
          elif [ -f "arch/${ARCH}/configs/${DEFCONFIG_NAME}" ]; then
            DEFCONFIG_PATH="${DEFCONFIG_NAME}"
          else
            echo "ERROR: Defconfig ${DEFCONFIG_NAME} not found!"
            exit 1
          fi

          echo "Use defconfig: ${DEFCONFIG_PATH}"
          make O=out "${DEFCONFIG_PATH}"
          if [ ! -f out/.config ]; then
            echo "ERROR: .config generate failed!"
            exit 1
          fi

      - name: Compile Kernel
        run: |
          set -euo pipefail
          export CC="ccache clang"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          make -j$(nproc) O=out Image.gz-dtb dtbo.img modules
          make -j$(nproc) O=out modules_install INSTALL_MOD_PATH=out/modules INSTALL_MOD_STRIP=1

          if [ ! -f "out/arch/${ARCH}/boot/Image.gz-dtb" ]; then
            echo "ERROR: Kernel build failed!"
            exit 1
          fi
          ccache -s

      - name: Package Artifacts
        run: |
          set -euo pipefail
          BUILD_DATE=$(date +%Y%m%d)
          ARTIFACT_NAME="kernel-sm8150-lineage23-${BUILD_DATE}"
          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> $GITHUB_ENV

          mkdir -p "${ARTIFACT_NAME}"
          cp "out/arch/${ARCH}/boot/Image.gz-dtb" "${ARTIFACT_NAME}/"
          cp "out/arch/${ARCH}/boot/dtbo.img" "${ARTIFACT_NAME}/"
          cp -r "out/modules" "${ARTIFACT_NAME}/"
          cp "out/.config" "${ARTIFACT_NAME}/kernel_defconfig"
          zip -r "${ARTIFACT_NAME}.zip" "${ARTIFACT_NAME}/"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: "*.zip"
          retention-days: 30
