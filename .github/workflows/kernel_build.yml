name: GitHub Action Build SM8150 4.14 Kernel
on:
  push:
    branches: [ "lineage-23.0" ]  # 仅监听目标分支推送
  workflow_dispatch:  # 支持手动触发，适配GitHub Action操作逻辑

jobs:
  build-sm8150-kernel:
    runs-on: ubuntu-22.04  # 固定GitHub官方推荐runner，兼容性最优
    permissions:
      contents: read  # 最小权限原则，符合GitHub Action安全规范
    env:
      # GitHub Action环境专用配置，避免变量冲突
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_USER: github-action
      KBUILD_BUILD_HOST: github
      DEFCONFIG: sm8150-perf_defconfig
      # 4.14内核+GitHub Action环境双重兼容的工具链版本
      CLANG_TAR: clang-r383902b.tar.gz
      GCC_TAR: aarch64-linux-android-4.9.tar.gz
      TOOLCHAIN_URL_PREFIX: https://mirrors.tuna.tsinghua.edu.cn/lineageOS/prebuilts

    steps:
      - name: 检出内核源码（GitHub Action专用配置）
        uses: actions/checkout@v4
        with:
          ref: lineage-23.0
          submodules: recursive  # 递归拉取子模块，适配内核源码依赖
          fetch-depth: 0  # 完整拉取历史，避免编译时缺失文件
          repository: hjiyu1965/android_kernel_oneplus_sm8150  # 明确仓库地址，避免歧义

      - name: 配置ccache缓存（GitHub Action缓存机制适配）
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          # 缓存key包含runner系统+内核仓库+提交SHA，确保缓存唯一性
          key: ${{ runner.os }}-sm8150-4.14-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sm8150-4.14-ccache-
        if: always()  # 无论前序步骤是否成功，均尝试恢复缓存

      - name: 安装编译依赖（GitHub Action Ubuntu 22.04适配）
        run: |
          set -euo pipefail
          # GitHub Action runner默认无sudo密码，直接执行更新安装
          sudo apt-get update -y && sudo apt-get upgrade -y
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libncurses5-dev \
            zip unzip curl wget git python2 python3 libelf-dev kmod cpio ccache
          # 4.14内核依赖python2，GitHub Action默认无软链接，手动创建
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          # 配置ccache缓存大小，适配GitHub Action runner存储限制
          ccache -M 10G && ccache -o compression=true && ccache -s

      - name: 下载+配置交叉编译工具链（GitHub Action网络适配）
        run: |
          set -euo pipefail
          TOOLCHAIN_DIR="${{ github.workspace }}/toolchain"
          # 清理旧工具链目录，避免GitHub Action缓存残留冲突
          rm -rf "${TOOLCHAIN_DIR}" && mkdir -p "${TOOLCHAIN_DIR}/clang" "${TOOLCHAIN_DIR}/aarch64-gcc"

          echo "=== 下载工具链（GitHub Action网络优化，清华静态链接） ==="
          # 实测GitHub Action可稳定访问的清华静态链接，无400/404
          wget -t 8 --timeout=40 --no-check-certificate -q \
            -O "${TOOLCHAIN_DIR}/clang/${CLANG_TAR}" \
            "${TOOLCHAIN_URL_PREFIX}/clang/host/linux-x86/${CLANG_TAR}"
          
          wget -t 8 --timeout=40 --no-check-certificate -q \
            -O "${TOOLCHAIN_DIR}/aarch64-gcc/${GCC_TAR}" \
            "${TOOLCHAIN_URL_PREFIX}/gcc/linux-x86/aarch64/${GCC_TAR}"

          echo "=== 解压工具链（适配GitHub Action文件权限） ==="
          tar -xzf "${TOOLCHAIN_DIR}/clang/${CLANG_TAR}" -C "${TOOLCHAIN_DIR}/clang" --strip-components=1
          tar -xzf "${TOOLCHAIN_DIR}/aarch64-gcc/${GCC_TAR}" -C "${TOOLCHAIN_DIR}/aarch64-gcc" --strip-components=1
          rm -f "${TOOLCHAIN_DIR}/clang/${CLANG_TAR}" "${TOOLCHAIN_DIR}/aarch64-gcc/${GCC_TAR}"

          echo "=== 修复权限（GitHub Action runner默认权限优化） ==="
          chmod -R 755 "${TOOLCHAIN_DIR}/clang/bin"
          chmod -R 755 "${TOOLCHAIN_DIR}/aarch64-gcc/bin"

          echo "=== 添加工具链到PATH（GitHub Action环境变量传递） ==="
          echo "${TOOLCHAIN_DIR}/clang/bin" >> $GITHUB_PATH
          echo "${TOOLCHAIN_DIR}/aarch64-gcc/bin" >> $GITHUB_PATH

      - name: 校验工具链环境（GitHub Action前置检查）
        run: |
          set -euo pipefail
          echo "=== GitHub Action工具链校验 ==="
          python --version || { echo "Python2未配置成功"; exit 1; }
          clang --version || { echo "Clang工具链失效"; exit 1; }
          aarch64-linux-android-gcc --version || { echo "GCC工具链失效"; exit 1; }
          echo "=== 工具链校验通过，符合GitHub Action编译要求 ==="

      - name: 加载内核配置（适配sm8150-perf_defconfig）
        run: |
          set -euo pipefail
          export CC="ccache clang"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-

          # 多路径兼容，适配内核仓库defconfig存放位置
          if [ -f "configs/vendor/${DEFCONFIG}" ]; then
            cp configs/vendor/${DEFCONFIG} arch/${ARCH}/configs/
          elif [ ! -f "arch/${ARCH}/configs/${DEFCONFIG}" ]; then
            echo "ERROR: ${DEFCONFIG}未找到！" && exit 1
          fi

          make O=out ${DEFCONFIG}
          [ -f "out/.config" ] || { echo "配置文件生成失败"; exit 1; }

      - name: 编译内核（GitHub Action多核优化）
        run: |
          set -euo pipefail
          export CC="ccache clang"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-

          # 利用GitHub Action runner全部CPU核心，加速编译
          make -j$(nproc) O=out Image.gz-dtb dtbo.img modules
          make -j$(nproc) O=out modules_install INSTALL_MOD_PATH=out/modules INSTALL_MOD_STRIP=1

          # 校验核心产物，避免编译失败未察觉
          [ -f "out/arch/${ARCH}/boot/Image.gz-dtb" ] || { echo "内核镜像编译失败"; exit 1; }
          ccache -s  # 输出缓存命中情况，优化后续编译

      - name: 打包编译产物（GitHub Action上传适配）
        run: |
          set -euo pipefail
          BUILD_DATE=$(date +%Y%m%d-%H%M%S)
          ARTIFACT_NAME="sm8150-kernel-4.14-lineage23-${BUILD_DATE}"
          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> $GITHUB_ENV

          mkdir -p ${ARTIFACT_NAME}
          cp out/arch/${ARCH}/boot/Image.gz-dtb ${ARTIFACT_NAME}/
          cp out/arch/${ARCH}/boot/dtbo.img ${ARTIFACT_NAME}/
          cp -r out/modules ${ARTIFACT_NAME}/
          cp out/.config ${ARTIFACT_NAME}/kernel-config
          zip -r ${ARTIFACT_NAME}.zip ${ARTIFACT_NAME}/

      - name: 上传产物到GitHub Action（保留30天）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: "*.zip"
          retention-days: 30  # 适配GitHub Action产物存储规则
          if-no-files-found: error  # 无产物时标记失败，便于排查
