name: Build OnePlus SM8150 Kernel 4.14

on:
  push:
    branches: [ lineage-23.0 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install compile dependencies
        run: |
          sudo apt update -y
          sudo apt install -y \
            git make bc bison flex libssl-dev libncurses-dev \
            build-essential zip curl lz4 zstd libelf-dev device-tree-compiler \
            python3 python3-pip

      - name: Download AOSP Clang 12 (4.14 kernel best compatible)
        run: |
          mkdir -p toolchain/clang
          # 用AOSP官方预编译工具链，比llvm官方更适配安卓内核，下载更稳定
          curl --fail --retry 5 --retry-delay 3 --location \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz \
            | tar -xzf - -C toolchain/clang

      - name: Download Linaro GCC aarch64 cross toolchain
        run: |
          mkdir -p toolchain/gcc
          curl --fail --retry 5 --retry-delay 3 --location \
            https://releases.linaro.org/components/toolchain/binaries/7.5-2019.10/aarch64-linux-gnu/gcc-linaro-7.5.0-2019.10-x86_64_aarch64-linux-gnu.tar.xz \
            | tar -xJf - --strip-components=1 -C toolchain/gcc

      - name: Build kernel
        run: |
          # 把工具链加入环境变量
          export PATH=$PWD/toolchain/clang/bin:$PWD/toolchain/gcc/bin:$PATH
          # 内核编译核心参数，适配4.14+Clang
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          # 加载设备配置
          make O=out vendor/sm8150-perf_defconfig
          # 并行编译
          make O=out -j$(nproc)

      - name: Pack AnyKernel3 flashable zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          # 兼容两种常见内核镜像，避免复制失败
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ || \
          cp out/arch/arm64/boot/Image AnyKernel3/
          # 复制设备树（可选，适配你的设备）
          cp -r out/arch/arm64/boot/dts/* AnyKernel3/dtb/ 2>/dev/null || true
          
          # 打包刷入包
          cd AnyKernel3
          zip -r9 OnePlus-SM8150-Kernel.zip * -x .git README.md
          cd ..

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus-SM8150-Kernel-4.14
          path: AnyKernel3/OnePlus-SM8150-Kernel.zip
          retention-days: 30
