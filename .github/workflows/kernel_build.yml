name: Build OnePlus SM8150 Kernel (4.14)
on:
  push:
    branches: [ "lineage-23.0" ]
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_USER: builder
      KBUILD_BUILD_HOST: github-action
      DEFCONFIG_NAME: sm8150-perf_defconfig
      CLANG_VERSION: r383902b
      GCC_VERSION: 4.9

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: lineage-23.0
          submodules: recursive
          fetch-depth: 0

      - name: Setup ccache Cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-sm8150-kernel-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sm8150-kernel-ccache-

      - name: Install Build Dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libncurses5-dev \
            zip unzip curl wget git python2 python3 libelf-dev kmod cpio ccache \
            device-tree-compiler
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          ccache -M 10G
          ccache -o compression=true
          ccache -s

      - name: Download & Setup Cross Compile Toolchain
        run: |
          set -euo pipefail
          TOOLCHAIN_DIR="${{ github.workspace }}/toolchain"
          rm -rf "${TOOLCHAIN_DIR}"
          mkdir -p "${TOOLCHAIN_DIR}/clang" "${TOOLCHAIN_DIR}/aarch64-gcc"

          echo "=== 1. 下载 Clang 工具链（AOSP 官方） ==="
          wget -t 10 --timeout=30 --retry-on-http-error=404,403,500,503 \
            -O clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r48/clang-${CLANG_VERSION}.tar.gz"

          echo "=== 2. 下载 GCC binutils 工具链（AOSP 官方，不含 gcc 但包含 ld 等） ==="
          wget -t 10 --timeout=30 --retry-on-http-error=404,403,500,503 \
            -O gcc.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-${GCC_VERSION}/+archive/refs/tags/android-11.0.0_r48.tar.gz"

          echo "=== 3. 校验下载完整性 ==="
          if [ ! -s clang.tar.gz ]; then
            echo "ERROR: Clang工具链下载失败，文件为空！"
            exit 1
          fi
          if [ ! -s gcc.tar.gz ]; then
            echo "ERROR: GCC工具链下载失败，文件为空！"
            exit 1
          fi
          tar -tzf clang.tar.gz > /dev/null || { echo "Clang压缩包损坏"; exit 1; }
          tar -tzf gcc.tar.gz > /dev/null || { echo "GCC压缩包损坏"; exit 1; }

          echo "=== 4. 解压工具链 ==="
          tar -xzf clang.tar.gz -C "${TOOLCHAIN_DIR}/clang"
          tar -xzf gcc.tar.gz -C "${TOOLCHAIN_DIR}/aarch64-gcc"
          rm -f clang.tar.gz gcc.tar.gz

          echo "=== 5. 修复权限 ==="
          chmod -R +x "${TOOLCHAIN_DIR}/clang/bin"
          chmod -R +x "${TOOLCHAIN_DIR}/aarch64-gcc/bin"
          
          # 重要：只检查必需的 binutils 工具（如 ld），不再要求 gcc
          if [ ! -f "${TOOLCHAIN_DIR}/clang/bin/clang" ]; then
            echo "ERROR: clang可执行文件缺失！"
            ls -la "${TOOLCHAIN_DIR}/clang/bin"
            exit 1
          fi
          if [ ! -f "${TOOLCHAIN_DIR}/aarch64-gcc/bin/aarch64-linux-android-ld" ]; then
            echo "ERROR: GCC binutils (ld) 缺失！"
            ls -la "${TOOLCHAIN_DIR}/aarch64-gcc/bin"
            exit 1
          fi

          echo "=== 6. 添加到系统PATH ==="
          echo "${TOOLCHAIN_DIR}/clang/bin" >> $GITHUB_PATH
          echo "${TOOLCHAIN_DIR}/aarch64-gcc/bin" >> $GITHUB_PATH
          echo "工具链配置完成！"

      - name: Verify Toolchain Environment
        run: |
          set -euo pipefail
          echo "=== 工具链校验 ==="
          python --version
          clang --version
          aarch64-linux-android-ld --version   # 只验证 ld
          which clang aarch64-linux-android-ld

      - name: Load Kernel Defconfig
        run: |
          set -euo pipefail
          export CC="ccache clang"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-

          DEFCONFIG_PATH=""
          if [ -f "arch/${ARCH}/configs/vendor/${DEFCONFIG_NAME}" ]; then
            DEFCONFIG_PATH="vendor/${DEFCONFIG_NAME}"
          elif [ -f "configs/vendor/${DEFCONFIG_NAME}" ]; then
            cp -f "configs/vendor/${DEFCONFIG_NAME}" "arch/${ARCH}/configs/"
            DEFCONFIG_PATH="${DEFCONFIG_NAME}"
          elif [ -f "arch/${ARCH}/configs/${DEFCONFIG_NAME}" ]; then
            DEFCONFIG_PATH="${DEFCONFIG_NAME}"
          else
            echo "ERROR: Defconfig未找到！"
            exit 1
          fi
          make O=out "${DEFCONFIG_PATH}"
          [ -f out/.config ] || exit 1

      - name: Compile Kernel
        run: |
          set -euo pipefail
          export CC="ccache clang"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-

          make -j$(nproc) O=out Image.gz-dtb dtbo.img modules
          make -j$(nproc) O=out modules_install INSTALL_MOD_PATH=out/modules INSTALL_MOD_STRIP=1
          [ -f "out/arch/${ARCH}/boot/Image.gz-dtb" ] || exit 1
          ccache -s

      - name: Package Build Artifacts
        run: |
          set -euo pipefail
          BUILD_DATE=$(date +%Y%m%d)
          ARTIFACT_NAME="kernel-sm8150-lineage23-${BUILD_DATE}"
          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> $GITHUB_ENV

          mkdir -p "${ARTIFACT_NAME}"
          cp "out/arch/${ARCH}/boot/Image.gz-dtb" "${ARTIFACT_NAME}/"
          cp "out/arch/${ARCH}/boot/dtbo.img" "${ARTIFACT_NAME}/"
          
          mkdir -p "${ARTIFACT_NAME}/modules"
          if [ -d out/modules/lib/modules ]; then
            cp -r out/modules/lib/modules/* "${ARTIFACT_NAME}/modules/"
          else
            echo "警告：模块目录不存在，跳过模块打包"
          fi
          
          cp "out/.config" "${ARTIFACT_NAME}/kernel_defconfig"
          zip -r "${ARTIFACT_NAME}.zip" "${ARTIFACT_NAME}/"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: "*.zip"
          retention-days: 30
