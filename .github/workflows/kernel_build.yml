name: Build OnePlus SM8150 Kernel 4.14 (Zero-Download Stable)

on:
  push:
    branches: [ lineage-23.0 ]
  workflow_dispatch:

jobs:
  build:
    # 固定使用Ubuntu 20.04，官方源内置GCC 7，完美适配4.14内核
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 一键安装所有依赖+交叉编译工具链（无外部下载）
        run: |
          set -euo pipefail
          sudo apt update -y
          # 直接从Ubuntu官方源安装所有需要的工具，包括适配4.14的GCC 7交叉编译链
          sudo apt install -y \
            git make bc bison flex libssl-dev libncurses-dev \
            build-essential zip lz4 zstd libelf-dev device-tree-compiler \
            python3 python3-pip gcc-7-aarch64-linux-gnu g++-7-aarch64-linux-gnu

      - name: 内核编译（纯GCC，零兼容问题）
        run: |
          set -euo pipefail
          # 指定交叉编译工具链，适配4.14内核
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=aarch64-linux-gnu-gcc-7
          export LD=aarch64-linux-gnu-ld
          export AR=aarch64-linux-gnu-ar
          export NM=aarch64-linux-gnu-nm
          export OBJCOPY=aarch64-linux-gnu-objcopy
          export OBJDUMP=aarch64-linux-gnu-objdump
          export STRIP=aarch64-linux-gnu-strip

          # 加载设备配置+编译
          make O=out vendor/sm8150-perf_defconfig
          make O=out -j$(nproc)

      - name: 打包AnyKernel3刷入包
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          # 兼容一加SM8150常见的两种内核镜像格式，避免复制失败
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ || \
          cp out/arch/arm64/boot/Image AnyKernel3/
          # 复制设备树文件
          cp -r out/arch/arm64/boot/dts/qcom/* AnyKernel3/dtb/ 2>/dev/null || true
          
          # 生成最终刷入包
          cd AnyKernel3
          zip -r9 OnePlus-SM8150-Kernel.zip * -x .git README.md
          cd ..

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus-SM8150-Kernel-4.14-Final
          path: AnyKernel3/OnePlus-SM8150-Kernel.zip
          retention-days: 30
