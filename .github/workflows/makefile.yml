name: Build Linux Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: '指定内核版本（留空则自动获取最新稳定版）'
        required: false
        default: ''
      arch:
        description: '编译架构'
        required: true
        default: 'x86_64'
        type: choice
        options:
          - x86_64
          - arm64
      config_source:
        description: '内核配置来源'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto                # 优先使用系统配置，否则 defconfig
          - defconfig           # 强制使用架构默认配置
          - system              # 强制使用当前系统配置（不存在则报错）
          - custom_url          # 从指定 URL 下载 .config 文件

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 安装基础依赖（含完整打包工具）
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libncurses-dev \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            bc \
            jq \
            debhelper \
            rsync \
            kernel-wedge \
            python3 \
            wget
          # 以上为内核编译及打包所需的所有工具

      - name: 安装交叉编译工具（按需）
        run: |
          if [ "${{ inputs.arch }}" = "arm64" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi

      - name: 获取内核版本
        id: kernel
        run: |
          if [ -z "${{ inputs.kernel_version }}" ]; then
            LATEST=$(curl -s https://www.kernel.org/releases.json | jq -r '.releases[] | select(.moniker=="stable") | .version')
            echo "KERNEL_VER=${LATEST}" >> $GITHUB_OUTPUT
            echo "自动获取最新稳定版: ${LATEST}"
          else
            echo "KERNEL_VER=${{ inputs.kernel_version }}" >> $GITHUB_OUTPUT
            echo "使用指定版本: ${{ inputs.kernel_version }}"
          fi

      - name: 缓存内核源码压缩包
        id: cache
        uses: actions/cache@v4
        with:
          path: linux-${{ steps.kernel.outputs.KERNEL_VER }}.tar.xz
          key: kernel-src-${{ steps.kernel.outputs.KERNEL_VER }}

      - name: 下载内核源码（如未缓存）
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          KVER=${{ steps.kernel.outputs.KERNEL_VER }}
          MAJOR=${KVER%%.*}
          wget https://cdn.kernel.org/pub/linux/kernel/v${MAJOR}.x/linux-${KVER}.tar.xz

      - name: 解压内核源码
        run: |
          tar -xf linux-${{ steps.kernel.outputs.KERNEL_VER }}.tar.xz

      - name: 配置内核（根据用户选择）
        run: |
          cd linux-${{ steps.kernel.outputs.KERNEL_VER }}
          # 设置架构相关变量
          if [ "${{ inputs.arch }}" = "arm64" ]; then
            export ARCH=arm64
            export CROSS_COMPILE=aarch64-linux-gnu-
          else
            export ARCH=x86_64
          fi

          CONFIG_SOURCE="${{ inputs.config_source }}"
          case "$CONFIG_SOURCE" in
            auto)
              if [ -f /boot/config-$(uname -r) ]; then
                cp /boot/config-$(uname -r) .config
                echo "使用当前系统配置作为基础"
              else
                make defconfig
                echo "使用默认 defconfig（未找到系统配置）"
              fi
              ;;
            defconfig)
              make defconfig
              echo "强制使用默认 defconfig"
              ;;
            system)
              if [ ! -f /boot/config-$(uname -r) ]; then
                echo "错误：未找到当前系统配置文件 /boot/config-$(uname -r)" >&2
                exit 1
              fi
              cp /boot/config-$(uname -r) .config
              echo "强制使用当前系统配置"
              ;;
            custom_url)
              read -p "请输入配置文件的 URL: " CONFIG_URL
              wget -O .config "$CONFIG_URL"
              echo "已从 $CONFIG_URL 下载配置文件"
              ;;
          esac

          # 更新旧配置，将新选项设为默认值
          make olddefconfig

      - name: 编译内核及生成 deb 包
        run: |
          cd linux-${{ steps.kernel.outputs.KERNEL_VER }}
          if [ "${{ inputs.arch }}" = "arm64" ]; then
            export ARCH=arm64
            export CROSS_COMPILE=aarch64-linux-gnu-
          else
            export ARCH=x86_64
          fi
          # 使用所有 CPU 核心并行编译，并忽略 dpkg-buildpackage 的依赖检查
          make -j$(nproc) bindeb-pkg DPKG_BUILDPACKAGE_OPTS="-d"
          # 将生成的 deb 包移动到统一目录
          mkdir -p artifacts
          mv ../*.deb artifacts/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: kernel-debs-${{ inputs.arch }}-${{ steps.kernel.outputs.KERNEL_VER }}
          path: artifacts/*.deb
          retention-days: 7
