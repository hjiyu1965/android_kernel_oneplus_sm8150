name: Simple OnePlus 8 Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 安装依赖
      run: |
        sudo apt update
        sudo apt install -y build-essential libncurses5-dev bison flex libssl-dev libelf-dev bc git wget
        
    - name: 克隆和准备内核
      run: |
        git clone https://github.com/hjiyu1965/android_kernel_oneplus_sm8150 --depth=1 --branch lineage-23.0
        cd android_kernel_oneplus_sm8150/msm-4.14
        
        # 修复 atomic 错误
        sed -i 's/atomic_inc_not_zero(/atomic_long_inc_not_zero(/g' include/linux/cred.h
        
    - name: 构建内核
      run: |
        cd android_kernel_oneplus_sm8150/msm-4.14
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        # 配置内核
        make vendor/sm8150-perf_defconfig
        
        # 构建
        make -j$(nproc) Image.gz-dtb 2>&1 | tee build.log
        
    - name: 上传结果
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build
        path: android_kernel_oneplus_sm8150/msm-4.14/arch/arm64/boot/Image.gz-dtb
