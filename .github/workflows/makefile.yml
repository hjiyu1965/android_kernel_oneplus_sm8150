name: Build Kernel Step by Step
on:
  workflow_dispatch:
    inputs:
      ksu_version:
        description: 'KernelSU Version (推荐: 11303, 11266, 或 11560)'
        required: true
        default: '11303'
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libncurses-dev \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            bc \
            git \
            curl \
            wget \
            zip \
            python3 \
            gcc-aarch64-linux-gnu
          
      - name: 克隆内核源码
        run: |
          git clone https://github.com/hjiyu1965/android_kernel_oneplus_sm8150 \
            --branch lineage-23.0 \
            --depth=1
          
          cd android_kernel_oneplus_sm8150/msm-4.14
          echo "KERNEL_DIR=$(pwd)" >> $GITHUB_ENV
          
      - name: 下载工具链
        run: |
          mkdir -p /tmp/toolchain
          cd /tmp/toolchain
          
          # 下载 AOSP Clang r416183b
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-12.0.0_r35/clang-r416183b.tar.gz
          tar -xzf clang-r416183b.tar.gz
          echo "CLANG_PATH=/tmp/toolchain/bin" >> $GITHUB_ENV
          
          # 下载 AOSP GCC 4.9
          wget https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.0.0_r35.tar.gz
          mkdir -p gcc
          tar -xzf android-12.0.0_r35.tar.gz -C gcc
          echo "GCC_PATH=/tmp/toolchain/gcc/bin" >> $GITHUB_ENV
          
      - name: 应用 KernelSU 并修复
        run: |
          cd $KERNEL_DIR
          
          KSU_VERSION="${{ github.event.inputs.ksu_version }}"
          echo "使用 KernelSU 版本: $KSU_VERSION"
          
          # 使用特定的提交版本，而不是 main
          if [ "$KSU_VERSION" = "11303" ]; then
            echo "使用 KernelSU v0.9.3"
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/11303/kernel/setup.sh" | bash -s -- -s 11303
          elif [ "$KSU_VERSION" = "11266" ]; then
            echo "使用 KernelSU v0.9.2"
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/11266/kernel/setup.sh" | bash -s -- -s 11266
          elif [ "$KSU_VERSION" = "11560" ]; then
            echo "使用 KernelSU v0.9.4"
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/11560/kernel/setup.sh" | bash -s -- -s 11560
          else
            # 尝试指定的版本
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/$KSU_VERSION/kernel/setup.sh" | bash -s -- -s $KSU_VERSION || true
          fi
          
          # 修复 atomic 错误
          sed -i 's/atomic_inc_not_zero/atomic_long_inc_not_zero/g' include/linux/cred.h 2>/dev/null || true
          
      - name: 配置内核
        run: |
          cd $KERNEL_DIR
          
          export ARCH=arm64
          export CROSS_COMPILE=$GCC_PATH/aarch64-linux-android-
          export PATH=$CLANG_PATH:$PATH
          export CC=clang
          
          make vendor/sm8150-perf_defconfig
          
          # 确保 KSU 配置已启用
          echo "CONFIG_KSU=y" >> .config
          echo "CONFIG_MODULE_SIG=n" >> .config
          
      - name: 构建内核
        run: |
          cd $KERNEL_DIR
          
          export ARCH=arm64
          export CROSS_COMPILE=$GCC_PATH/aarch64-linux-android-
          export PATH=$CLANG_PATH:$PATH
          export CC=clang
          
          # 禁用错误警告
          export KCFLAGS="-Wno-error=incompatible-pointer-types"
          
          make -j$(nproc) Image.gz-dtb 2>&1 | tee build.log
          
      - name: 检查构建结果
        run: |
          cd $KERNEL_DIR
          if [ -f "arch/arm64/boot/Image.gz-dtb" ]; then
            echo "✅ 构建成功！"
            ls -lh arch/arm64/boot/Image.gz-dtb
          else
            echo "❌ 构建失败！"
            tail -50 build.log
            exit 1
          fi
          
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: |
            ${{ env.KERNEL_DIR }}/arch/arm64/boot/Image.gz-dtb
            ${{ env.KERNEL_DIR }}/build.log
